<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found · José A. Mendoza</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)" />

  <!-- Absolute paths so this works from any URL depth -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />

  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">José A. Mendoza<span class="dot">.</span></a>
    <button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle light/dark theme" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="err-page">
  <p class="code">ERROR 404 · NOT FOUND</p>
  <h1>Page <em>not found.</em></h1>
  <p>The page you're looking for doesn't exist, moved, or never did. Let's get you back.</p>
  <div class="hero-actions" style="justify-content:center;">
    <a href="/" class="btn btn-primary">← Back home</a>
    <a href="/blog/" class="btn btn-ghost">Read the blog</a>
  </div>
</main>

<footer>
  <div class="foot-inner">
    <span>© <span id="year">2026</span> José A. Mendoza</span>
    <span>computer science<span class="dot"> · </span>software engineering</span>
    <span>Mexico City, MX</span>
  </div>
</footer>

<script src="/assets/js/site.js" defer></script>
</body>
</html>
